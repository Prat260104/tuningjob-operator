# Realistic ML training hyperparameter tuning example.
# This demonstrates a typical machine learning use case with standard hyperparameters.
#
# To use this example with your own training code:
# 1. Replace 'your-registry/ml-training:latest' with your actual training image
# 2. Your training script should:
#    - Read hyperparameters from TUNING_PARAM_* environment variables
#    - Train your model with those parameters
#    - Compute a validation metric (e.g. accuracy, F1 score, validation loss)
#    - Create a ConfigMap with the metric value (see result reporting section below)
# 3. Adjust resource requests/limits based on your training workload
# 4. Set appropriate goal (maximize for accuracy, minimize for loss)
#
# Apply with: kubectl apply -f examples/ml-training-tuning.yaml

apiVersion: tuning.tuning.dev/v1alpha1
kind: TuningJob
metadata:
  name: ml-training-tuning
  namespace: default
spec:
  maxTrials: 20
  parallelism: 2
  maxFailedTrials: 5
  goal: maximize  # maximize for accuracy/F1, or minimize for loss
  
  parameters:
    # Learning rate for optimizer
    - name: learning_rate
      min: "0.0001"
      max: "0.1"
    
    # Training batch size
    - name: batch_size
      min: "16"
      max: "256"
    
    # Optimizer algorithm
    - name: optimizer
      values:
        - sgd
        - adam
        - adamw
        - rmsprop
    
    # Dropout rate for regularization
    - name: dropout
      min: "0.0"
      max: "0.5"
    
    # Weight decay (L2 regularization)
    - name: weight_decay
      min: "0.0"
      max: "0.01"
  
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: ml-training
        spec:
          restartPolicy: Never
          serviceAccountName: tuning-trial-sa
          
          containers:
            - name: trainer
              # REPLACE THIS with your actual training image
              # Example: gcr.io/my-project/pytorch-trainer:v1.0
              image: your-registry/ml-training:latest
              imagePullPolicy: Always
              
              # Hyperparameters are automatically injected as environment variables:
              # TUNING_PARAM_learning_rate
              # TUNING_PARAM_batch_size
              # TUNING_PARAM_optimizer
              # TUNING_PARAM_dropout
              # TUNING_PARAM_weight_decay
              
              # Additional environment variables for your training script
              env:
                - name: DATASET_PATH
                  value: "/data/training"
                - name: MODEL_OUTPUT_PATH
                  value: "/models/output"
                - name: EPOCHS
                  value: "10"
              
              # Resource requests/limits - adjust based on your workload
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "2"
                limits:
                  memory: "8Gi"
                  cpu: "4"
                  # Uncomment if using GPU:
                  # nvidia.com/gpu: "1"
              
              # Volumes for datasets and model storage
              volumeMounts:
                - name: dataset
                  mountPath: /data/training
                  readOnly: true
                - name: model-output
                  mountPath: /models/output
          
          volumes:
            - name: dataset
              # REPLACE with your dataset source
              # Examples:
              # - persistentVolumeClaim: {claimName: training-dataset-pvc}
              # - nfs: {server: nfs.example.com, path: /datasets/training}
              # - hostPath: {path: /mnt/data/training, type: Directory}
              emptyDir: {}
            
            - name: model-output
              emptyDir: {}

---
