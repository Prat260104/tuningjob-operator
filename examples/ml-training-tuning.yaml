---
# ServiceAccount for trial Jobs (required for ConfigMap creation)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuning-trial-sa
  namespace: default

---
# Role allowing ConfigMap operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuning-trial-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "patch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuning-trial-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: tuning-trial-sa
    namespace: default
roleRef:
  kind: Role
  name: tuning-trial-role
  apiGroup: rbac.authorization.k8s.io
